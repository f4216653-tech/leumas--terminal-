
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leumas Terminal | Institutional Login</title>
    <script src="https://www.gstatic.com/firebasejs/10.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.0.0/firebase-auth-compat.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f8f9fa; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .logo-header { position: absolute; top: 20px; left: 20px; font-weight: bold; border-bottom: 2px solid black; padding-bottom: 5px; font-size: 1.2rem; }
        .card { background: white; padding: 40px; border-radius: 8px; border: 1px solid #e1e1e1; width: 350px; text-align: center; }
        h2 { font-size: 28px; margin-bottom: 5px; }
        input { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
        .btn-main { width: 100%; padding: 12px; background: #2176d2; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: 600; }
        .divider { display: flex; align-items: center; text-align: center; color: #999; font-size: 11px; margin: 25px 0; }
        .divider::before, .divider::after { content: ''; flex: 1; border-bottom: 1px solid #eee; }
        .divider:not(:empty)::before { margin-right: .5em; }
        .divider:not(:empty)::after { margin-left: .5em; }
        .btn-social { flex: 1; padding: 10px; border: 1px solid #ddd; background: white; border-radius: 4px; font-size: 14px; cursor: pointer; color: #4285F4; font-weight: bold; width: 100%; }
    </style>
</head>
<body>
    <div class="logo-header">LEUMAS TERMINAL</div>
    <div class="card">
        <h2>Sign up</h2>
        <p style="color: #666; margin-bottom: 20px;">Sign up to continue</p>
        <input type="email" placeholder="Email">
        <input type="password" placeholder="Password">
        <button class="btn-main">Sign up</button>
        <div class="divider">ACCESS QUICKLY</div>
        <button class="btn-social" onclick="googleSignIn()">Google</button>
    </div>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCB2_DvnFPBDAI3RsqTgpiUhnB1CaXj-14",
            authDomain: "leumas-terminal.firebaseapp.com",
            projectId: "leumas-terminal",
            appId: "1:345308940671:web:37cff5b548334171acf24a"
        };
        firebase.initializeApp(firebaseConfig);
        function googleSignIn() {
            const provider = new firebase.auth.GoogleAuthProvider();
            firebase.auth().signInWithPopup(provider).then((result) => {
                return result.user.getIdToken();
            }).then(idToken => {
                return fetch('/login/firebase', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ idToken: idToken })
                });
            }).then(res => { if(res.ok) window.location.href = "/"; })
            .catch(err => alert("Error: " + err.message));
        }
    </script>
</body>
</html>
