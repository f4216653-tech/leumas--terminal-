<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leumas Terminal | Institutional Access</title>
    <script src="https://www.gstatic.com/firebasejs/10.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.0.0/firebase-auth-compat.js"></script>
    <style>
        body { font-family: sans-serif; background: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .auth-card { width: 320px; padding: 30px; border: 1px solid #eee; text-align: center; }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ddd; box-sizing: border-box; }
        .btn { width: 100%; padding: 12px; cursor: pointer; font-weight: bold; }
        .btn-blue { background: #1a73e8; color: white; border: none; }
        .btn-white { background: white; border: 1px solid #ddd; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="auth-card">
        <h2 id="title">Sign in</h2>
        <input type="email" id="emailField" placeholder="Email">
        <input type="password" id="passField" placeholder="Password">
        <button class="btn btn-blue" id="submitBtn" onclick="handleAuth()">Sign in</button>
        <div style="margin: 15px 0; font-size: 10px; color: #aaa;">ACCESS QUICKLY</div>
        <button class="btn btn-white" onclick="googleSignIn()">Continue with Google</button>
        <p id="toggle" style="font-size: 12px; color: #555; cursor: pointer; margin-top: 20px;" onclick="toggle()">Need an account? Sign up</p>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCB2_DvnFPBDAI3RsqTgpiUhnB1CaXj-14",
            authDomain: "leumas-terminal.firebaseapp.com",
            projectId: "leumas-terminal",
            appId: "1:345308940671:web:37cff5b548334171acf24a"
        };
        firebase.initializeApp(firebaseConfig);

        let isLogin = true;

        function toggle() {
            isLogin = !isLogin;
            document.getElementById('title').innerText = isLogin ? "Sign in" : "Sign up";
            document.getElementById('submitBtn').innerText = isLogin ? "Sign in" : "Sign up";
            document.getElementById('toggle').innerText = isLogin ? "Need an account? Sign up" : "Have an account? Sign in";
        }

        function handleAuth() {
            const email = document.getElementById('emailField').value;
            const pass = document.getElementById('passField').value;
            const action = isLogin ? 
                firebase.auth().signInWithEmailAndPassword(email, pass) : 
                firebase.auth().createUserWithEmailAndPassword(email, pass);
            
            action.then(res => res.user.getIdToken())
                  .then(token => sendToken(token))
                  .catch(err => alert(err.message));
        }

        function googleSignIn() {
            const provider = new firebase.auth.GoogleAuthProvider();
            firebase.auth().signInWithRedirect(provider); // Fix for mobile
        }

        // Catch the Google redirect result
        firebase.auth().getRedirectResult().then(result => {
            if (result.user) {
                result.user.getIdToken().then(token => sendToken(token));
            }
        });

        function sendToken(idToken) {
            fetch('/login/firebase', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ idToken: idToken })
            }).then(res => {
                if (res.ok) window.location.href = "/dashboard";
                else alert("Unauthorized access.");
            });
        }
    </script>
</body>
</html>
