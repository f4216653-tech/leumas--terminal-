<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leumas Terminal | Access</title>
    <script src="https://www.gstatic.com/firebasejs/10.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.0.0/firebase-auth-compat.js"></script>
    <style>
        body { font-family: sans-serif; background: #050505; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { width: 320px; padding: 40px; border: 1px solid #222; text-align: center; background: #0a0a0a; }
        .btn-google { width: 100%; padding: 12px; background: #fff; color: #000; border: none; font-weight: bold; cursor: pointer; border-radius: 2px; }
    </style>
</head>
<body>
    <div class="card">
        <h2 style="color: #d4af37; letter-spacing: 2px;">LEUMAS TERMINAL</h2>
        <p style="font-size: 11px; color: #666; margin-bottom: 30px;">Institutional Order Flow Intelligence</p>
        <button class="btn-google" onclick="googleSignIn()">CONTINUE WITH GOOGLE</button>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCB2_DvnFPBDAI3RsqTgpiUhnB1CaXj-14",
            authDomain: "leumas-terminal.firebaseapp.com",
            projectId: "leumas-terminal",
            appId: "1:345308940671:web:37cff5b548334171acf24a"
        };
        firebase.initializeApp(firebaseConfig);

        function googleSignIn() {
            const provider = new firebase.auth.GoogleAuthProvider();
            firebase.auth().signInWithRedirect(provider);
        }

        firebase.auth().getRedirectResult().then(result => {
            if (result.user) {
                result.user.getIdToken().then(token => sendToken(token));
            }
        });

        function sendToken(idToken) {
            fetch('/login/firebase', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ idToken: idToken })
            }).then(res => res.json()).then(data => {
                if (data.status === "success") {
                    localStorage.setItem("isPremium", data.is_premium);
                    window.location.href = "/dashboard";
                }
            });
        }
    </script>
</body>
</html>
