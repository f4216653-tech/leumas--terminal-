<script>
    const firebaseConfig = {
        apiKey: "AIzaSyCB2_DvnFPBDAI3RsqTgpiUhnB1CaXj-14",
        authDomain: "leumas-terminal.firebaseapp.com",
        projectId: "leumas-terminal",
        appId: "1:345308940671:web:37cff5b548334171acf24a"
    };
    firebase.initializeApp(firebaseConfig);

    let isSignUpMode = true; // Controls if we are Signing Up or Signing In

    // 1. TOGGLE LOGIC (Fixes the "Email in use" loop)
    function toggleMode() {
        isSignUpMode = !isSignUpMode;
        document.getElementById('authTitle').innerText = isSignUpMode ? "Sign up" : "Sign in";
        document.getElementById('submitBtn').innerText = isSignUpMode ? "Sign up" : "Sign in";
        document.getElementById('toggleLink').innerText = isSignUpMode ? "Sign in" : "Sign up";
    }

    // 2. MANUAL EMAIL/PASSWORD LOGIC
    function handleAuth() {
        const email = document.getElementById('emailField').value.trim();
        const pass = document.getElementById('passField').value;

        if (!email || !pass) {
            alert("Please enter both email and password.");
            return;
        }

        if (isSignUpMode) {
            // Tries to create a new account
            firebase.auth().createUserWithEmailAndPassword(email, pass)
                .then(userCredential => userCredential.user.getIdToken())
                .then(idToken => sendTokenToBackend(idToken))
                .catch(err => alert("Sign up failed: " + err.message));
        } else {
            // Tries to log into existing account
            firebase.auth().signInWithEmailAndPassword(email, pass)
                .then(userCredential => userCredential.user.getIdToken())
                .then(idToken => sendTokenToBackend(idToken))
                .catch(err => alert("Sign in failed: " + err.message));
        }
    }

    // 3. GOOGLE REDIRECT (Fixes mobile "No response")
    function googleSignIn() {
        const provider = new firebase.auth.GoogleAuthProvider();
        firebase.auth().signInWithRedirect(provider);
    }

    // Handles the return from Google
    firebase.auth().getRedirectResult().then((result) => {
        if (result.user) {
            result.user.getIdToken().then(idToken => sendTokenToBackend(idToken));
        }
    }).catch(err => alert("Google Error: " + err.message));

    // 4. BACKEND COMMUNICATION
    function sendTokenToBackend(idToken) {
        fetch('/login/firebase', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ idToken: idToken })
        }).then(res => {
            if(res.ok) window.location.href = "/";
            else alert("Backend error. Check Flask logs.");
        });
    }
                      </script>
