<!DOCTYPE html>
<html>
<head>
    <title>Leumas Terminal | Live</title>
    <style>
        body { background: #ffffff; color: #111; font-family: 'Segoe UI', sans-serif; }
        .grid { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; padding: 20px; }
        .card { border: 1px solid #ddd; padding: 15px; border-radius: 2px; }
        .signal-box { background: #f9f9f9; border-left: 5px solid #0052ff; }
        .price-up { color: #008000; }
        .price-down { color: #d00000; }
        .blur { filter: blur(4px); }
    </style>
</head>
<body>
    <div style="border-bottom: 2px solid #000; padding: 10px 20px;">
        <h2>LEUMAS <span style="font-weight:100">INSTITUTIONAL</span></h2>
    </div>

    <div class="grid">
        <div class="card">
            <h3>Live Market Intelligence (10 Assets)</h3>
            <div id="market-feed">Loading Institutional Data...</div>
        </div>

        <div class="card signal-box">
            <h3>SMC Predictor (2/4 Accuracy)</h3>
            <div id="signal-engine">Analyzing Market Liquidity...</div>
        </div>
    </div>

    <script>
        async function fetchMarket() {
            const res = await fetch('/api/market-data');
            const data = await res.json();
            const feed = document.getElementById('market-feed');
            feed.innerHTML = "";

            Object.keys(data).forEach(asset => {
                const price = parseFloat(data[asset].price).toFixed(2);
                feed.innerHTML += `<div style="padding:5px; border-bottom:1px solid #eee">
                    <strong>${asset}:</strong> $${price}
                </div>`;
            });

            // 2/4 Algorithmic Thinking Logic
            const btc = parseFloat(data["BTC/USD"].price);
            const gold = parseFloat(data["XAU/USD"].price);
            const engine = document.getElementById('signal-engine');

            // Signal Confluence Logic
            if (btc > 75000 && gold > 2300) {
                engine.innerHTML = `<div style="color:green"><strong>STRONG BUY CONFLUENCE</strong><br>
                Targeting Liquidity Grab at next FVG zone.<br>
                Confidence: 87%</div>`;
            } else {
                engine.innerHTML = "Market Neutral. Waiting for Inducement.";
            }
        }

        setInterval(fetchMarket, 60000); // 60s refresh
        fetchMarket();
    </script>
</body>
</html>
