<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leumas Institutional | Dashboard</title>
    <script src="https://assets.lemonsqueezy.com/lemon.js" defer></script>
    <style>
        :root { --bg: #050505; --panel: #0c0c0c; --border: #1a1a1a; --gold: #d4af37; --green: #00ff88; }
        body { margin: 0; background: var(--bg); color: #fff; font-family: 'Inter', sans-serif; display: flex; height: 100vh; overflow: hidden; }
        .sidebar { width: 280px; border-right: 1px solid var(--border); background: var(--panel); }
        .main { flex: 1; position: relative; }
        .paywall { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 100; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(8px); }
        .btn-gold { display: block; padding: 15px; background: var(--gold); color: black; text-decoration: none; font-weight: bold; border-radius: 2px; text-align: center; }
    </style>
</head>
<body>
    <div class="sidebar">
        <div style="padding: 20px; border-bottom: 1px solid var(--border); color: var(--gold); font-weight: 800; font-size: 12px;">INTEL FEED</div>
        <div style="padding: 20px;">
            <div style="font-size: 10px; color: #444; margin-bottom: 5px;">BIAS: BULLISH</div>
            <div style="color: var(--green); font-size: 14px; font-weight: bold;">XAUUSD TARGET: 2325.00</div>
        </div>
    </div>

    <div class="main">
        <div id="paywall" class="paywall">
            <div style="border: 1px solid var(--gold); padding: 40px; background: #000; text-align: center; max-width: 320px;">
                <h3 style="margin: 0 0 15px 0;">Premium Access Locked</h3>
                <p style="font-size: 12px; color: #666; margin-bottom: 25px;">Institutional levels, entries, and risk management are reserved for Elite members.</p>
                <a href="https://leumas-institutional.lemonsqueezy.com/checkout/buy/eb356f78-8db1-45b9-8aed-6b857cdebef0?embed=1" class="lemonsqueezy-button btn-gold">UPGRADE FOR $10</a>
            </div>
        </div>
        <div id="chart" style="width: 100%; height: 100%;"></div>
    </div>

    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    <script>
        window.onload = function() {
            // Admin bypass check
            if (localStorage.getItem("isPremium") === "true") {
                document.getElementById('paywall').style.display = 'none';
            }
        };

        new TradingView.widget({
            "autosize": true,
            "symbol": "OANDA:XAUUSD",
            "interval": "15",
            "theme": "dark",
            "container_id": "chart"
        });
    </script>
</body>
</html>
