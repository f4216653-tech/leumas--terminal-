<!DOCTYPE html>
<html>
<head>
    <title>Leumas Terminal | Dashboard</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: #ffffff; }
        .header { padding: 20px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; }
        .chart-container { height: 80vh; padding: 20px; }
        .mamba-status { color: #6a0dad; font-weight: bold; font-size: 0.8em; } /* A nod to the Mamba Mentality */
    </style>
</head>
<body>

    <div class="header">
        <div>
            <h2 style="margin:0;">Institutional Dashboard</h2>
            <span class="mamba-status">FOCUS • DISCIPLINE • EXECUTION</span>
        </div>
        <a href="/logout" style="text-decoration:none; color: #ff4444;">Logout</a>
    </div>

    <div class="chart-container">
        <div id="tradingview_widget"></div>
        <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
        <script type="text/javascript">
        new TradingView.widget({
          "autosize": true,
          "symbol": "OANDA:XAUUSD",
          "interval": "H1",
          "timezone": "Etc/UTC",
          "theme": "light",
          "style": "1",
          "locale": "en",
          "toolbar_bg": "#f1f3f6",
          "enable_publishing": false,
          "hide_side_toolbar": false,
          "allow_symbol_change": true,
          "container_id": "tradingview_widget"
        });
        </script>
        </div>

</body>
</html>
