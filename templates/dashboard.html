<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leumas Institutional | Terminal</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        :root { --bg: #ffffff; --text: #1a1a1b; --border: #e0e0e0; --accent: #0052ff; }
        body { background-color: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; }
        .terminal-container { padding: 20px; }
        .grid-card { border: 1px solid var(--border); border-radius: 4px; padding: 15px; margin-bottom: 20px; min-height: 200px; }
        .premium-blur { filter: blur(5px); pointer-events: none; user-select: none; }
        .signal-badge { padding: 5px 10px; border-radius: 3px; font-weight: bold; }
        .buy { color: #00c853; background: rgba(0, 200, 83, 0.1); }
        .sell { color: #ff3d00; background: rgba(255, 61, 0, 0.1); }
        #gold-price, #btc-price { font-size: 1.5rem; font-weight: 700; }
    </style>
</head>
<body>

<nav class="navbar navbar-light bg-light border-bottom">
    <div class="container-fluid">
        <span class="navbar-brand mb-0 h1">LEUMAS <span style="font-weight: 200;">INSTITUTIONAL</span></span>
        <span class="badge bg-primary">{{ role }} ACCESS</span>
    </div>
</nav>

<div class="terminal-container container-fluid">
    <div class="row">
        <!-- Live Market Panel -->
        <div class="col-md-8">
            <div class="grid-card">
                <h5>Global Market Flow</h5>
                <table class="table table-sm">
                    <thead>
                        <tr><th>Asset</th><th>Live Price</th><th>Trend</th><th>Institutional Volume</th></tr>
                    </thead>
                    <tbody id="market-body">
                        <!-- Filled by JS -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Predictive Engine (2/4 Strategy) -->
        <div class="col-md-4">
            <div class="grid-card {% if role == 'Free' %}premium-blur{% endif %}">
                <h5>Algorithmic Signals</h5>
                <div id="signal-engine">
                    <p class="text-muted">Analyzing SMC Data...</p>
                    <!-- Predicted Signals appear here -->
                </div>
                {% if role == 'Free' %}
                <div style="position: absolute; top: 30%; left: 10%; text-align: center;">
                    <a href="/subscription" class="btn btn-primary">Unlock Premium Signals</a>
                </div>
                {% endif %}
            </div>

            <!-- Sentiment & Correlation -->
            <div class="grid-card">
                <h5>Market Sentiment</h5>
                <div class="d-flex justify-content-between align-items-center">
                    <span>XAU/USD Sentiment:</span>
                    <span id="gold-sentiment" class="signal-badge buy">BULLISH</span>
                </div>
                <hr>
                <small class="text-muted">Correlation: BTC/USD +0.84 to Gold</small>
            </div>
        </div>
    </div>
</div>

<script>
    const ROLE = "{{ role }}";
    const ASSETS_LIST = ["BTC/USD", "XAU/USD", "EUR/USD", "GBP/USD", "NVDA", "AAPL", "ETH/USD", "XAG/USD", "TSLA", "USD/JPY"];

    async function updateTerminal() {
        try {
            const res = await fetch('/api/market-data');
            const data = await res.json();
            
            const tbody = document.getElementById('market-body');
            tbody.innerHTML = '';

            // Filter assets based on role
            const visibleAssets = ROLE === 'Free' ? ASSETS_LIST.slice(0, 3) : ASSETS_LIST;

            visibleAssets.forEach(symbol => {
                const price = data[symbol]?.price || "Loading...";
                const change = (Math.random() * 2).toFixed(2); // Mocking change for UI demo
                
                tbody.innerHTML += `
                    <tr>
                        <td><strong>${symbol}</strong></td>
                        <td>$${parseFloat(price).toLocaleString()}</td>
                        <td class="${change > 1 ? 'text-success' : 'text-danger'}">${change}%</td>
                        <td>High (Institutional)</td>
                    </tr>
                `;
            });

            if (ROLE !== 'Free') {
                runAlgorithmicLogic(data);
            }
        } catch (e) { console.error("Terminal Sync Error", e); }
    }

    function runAlgorithmicLogic(data) {
        const signalBox = document.getElementById('signal-engine');
        // 2/4 Accuracy Logic: We only trigger a "Confirm" if price is at extreme relative to BTC
        const btcPrice = parseFloat(data["BTC/USD"]?.price);
        
        if (btcPrice > 80000) {
            signalBox.innerHTML = `
                <div class="alert alert-success">
                    <strong>LEUMAS SIGNAL:</strong> BUY BTC/USD<br>
                    <small>Reason: Institutional Liquidity Grab at 78k confirmed.</small>
                    <div class="mt-2"><span class="signal-badge buy">CONFIDENCE: 88%</span></div>
                </div>
            `;
        }
    }

    setInterval(updateTerminal, 60000); // 60s Institutional Refresh
    updateTerminal();
</script>

</body>
</html>
